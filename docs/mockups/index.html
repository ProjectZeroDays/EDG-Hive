<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive — Mockup</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #57606a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .logo {
      display: block;
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    main {
      padding: 24px 20px;
    }
  </style>
</head>
<body>
  <header>
    <a class="logo-link" href="#" aria-label="Hive Home">
      <picture>
        <source
          media="(prefers-color-scheme: light)"
          srcset="https://raw.githubusercontent.com/ProjectZeroDays/EDG-HIVE/master/web/public/hive-README.png"
        />
        <img
          class="logo"
          src="../web/public/hive-README.png"
          alt="Hive Logo"
        />
      </picture>
    </a>
    <div>
      <div class="brand-title">Hive</div>
      <div class="brand-subtitle">Autonomous penetration testing that keeps its receipts.</div>
    </div>
  </header>

  <main>
    <p>Mockup workspace ready.</p>
  </main>
</body>
</html>
